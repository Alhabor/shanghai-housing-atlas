ned result now includes listing-level review: continue with Yaohua Road; keep Longhua and Longyao Road conditional; reconsider Yunjin Road.',foot:'Combined snapshot: commute 22 July 2026; rental market, Baidu walking and listing details 23 July 2026. All rents are whole-home monthly totals for two occupants, not per-person prices; even splits are arithmetic references only. Stations without an independent commute anchor show only their verified corridor interval.'}

    document.getElementById('detail').innerHTML=`<div class="detail-top"><div><div class="eyebrow">${t('selected')} · ${lang==='zh'?s.line+'号线':'Line '+s.line}</div><h2>${label(s)}</h2><div class="english">${t('listingTitle')}</div></div><span class="state" style="--badge-color:${active.color}">${active.label}</span></div><div class="metrics"><div class="metric"><b>${p.candidate_pool_count}</b><span>${t('candidatePool')}</span></div><div class="metric"><b>${p.detail_sample_count}</b><span>${t('detailSamples')}</span></div><div class="metric"><b>${p.conditional_pass_count}</b><span>${t('conditionalPass')}</span></div></div><div class="decision"><b>${lang==='zh'?'扩样结论':'Expanded-sample conclusion'}${sep}${phaseDecisionLabel(s)}</b><br>${lang==='zh'?p.main_reason_cn:phaseConclusionEn(s)}</div><div class="phase-note">${bands}<br>${lang==='zh'?`候选整租 ${money(p.whole_rent_min_cny)}–${money(p.whole_rent_max_cny)}；样本中位整租 ${money(p.sample_median_rent_cny)}，中位面积 ${p.sample_median_area_sqm}㎡。所有价格均为两人合计整套月租。`:`Candidate whole-home rent ${money(p.whole_rent_min_cny)}–${money(p.whole_rent_max_cny)}; medians ${money(p.sample_median_rent_cny)} and ${p.sample_median_area_sqm} m². All rents are whole-home totals for two occupants.`}</div><div class="section">${lang==='zh'?'逐套详情样本':'Listing-level samples'}</div><div class="sample-grid">${cards}</div>`;
  }
  listingDetail=listingDetailV3;
  const mapViewBase=mapView,legendBase=legend;
  function focusCommunityCards(key){const cards=[...document.querySelectorAll('.sample-card')];cards.forEach(x=>x.classList.toggle('map-focus',x.dataset.communityKey===key));const target=cards.find(x=>x.dataset.communityKey===key);if(target)target.scrollIntoView({behavior:'smooth',block:'nearest'})}
  function listingMapViewV3(animate){
    clearDynamic();refreshMarkers();const s=byId[selected],p=coord(s),bounds=[p],col=combinedColor[s.phase2.atlas_status];baseLines.forEach(x=>x.setStyle({opacity:.12,weight:3}));
    const circle=L.circle(p,{radius:s.search_radius_m,color:'#59667a',weight:1.5,opacity:.65,fillColor:'#59667a',fillOpacity:.025,dashArray:'6 7'}).addTo(map);dynamic.push(circle);
    const groups=s.phase2.listings.reduce((a,x)=>{const k=communityKey(x.community);(a[k]??=[]).push(x);return a},{});
    Object.entries(groups).forEach(([name,items],index)=>{const c=s.communities.find(x=>communityKey(x.name)===name);if(!c)return;const cp=[c.lat,c.lon],pass=items.filter(x=>x.hard_requirement_status==='conditional_pass').length,pending=items.filter(x=>x.hard_requirement_status==='manual_floor_check').length,fail=items.filter(x=>x.hard_requirement_status==='fail_floor_elevator').length,total=items.length,toLeft=c.lon>p[1],bars=`<span class="poi-bars"><i style="flex:${pass};background:var(--priority)"></i><i style="flex:${pending};background:var(--conditional)"></i><i style="flex:${fail};background:var(--pause)"></i></span>`,html=`<div class="compound-poi${toLeft?' to-left':''}"><span class="poi-copy"><b>${c.name}</b><small>${c.walk_m}m · ${total}${lang==='zh'?'套':' listings'}</small>${bars}</span></div>`;bounds.push(cp);
      const m=L.marker(cp,{icon:L.divIcon({className:'',html,iconSize:[150,42],iconAnchor:toLeft?[150,21]:[0,21]}),zIndexOffset:520}).addTo(map),rows=items.map(x=>{const st=sampleStatus(x.hard_requirement_status);return `<div class="poi-popup-row"><a href="${x.listing_url}" target="_blank" rel="noreferrer">${x.sample_id} · ${x.area_sqm}${lang==='zh'?'㎡':' m²'}</a><span style="color:${st.color}">${money(x.whole_rent_cny)}</span></div>`}).join(''),popup=`<div class="poi-popup"><div class="poi-popup-title">${c.name} · ${total}${lang==='zh'?'套详情样本':' detail samples'}</div><div class="poi-popup-meta">${lang==='zh'?`百度步行 ${c.walk_m}m / ${c.walk_min}分钟`:`Baidu walk ${c.walk_m}m / ${c.walk_min} min`} · <span style="color:var(--priority)">${pass}</span>/<span style="color:var(--conditional)">${pending}</span>/<span style="color:var(--pause)">${fail}</span></div>${rows}<div class="poi-precision">${lang==='zh'?'定位精度：百度小区POI；不代表具体楼栋或门牌。':'Precision: verified Baidu compound POI, not a building or unit.'}</div></div>`;m.bindPopup(popup,{maxWidth:300});m.on('click',()=>focusCommunityCards(name));dynamic.push(m)
    });
    map.fitBounds(L.latLngBounds(bounds).pad(.32),{maxZoom:16.25,animate,padding:[55,55]});
  }
  mapView=function(animate){if(mode==='listings')return listingMapViewV3(animate);return mapViewBase(animate)};
  legend=function(){if(mode!=='listings')return legendBase();document.getElementById('legend').innerHTML=`<div class="legend-row"><span class="poi-anchor"></span>${lang==='zh'?'百度小区 POI':'Baidu compound POI'}</div><div class="legend-row"><span class="legend-line" style="--legend-line:var(--priority)"></span>${lang==='zh'?'条件通过样本':'Conditional pass'}</div><div class="legend-row"><span class="legend-line" style="--legend-line:var(--conditional)"></span>${lang==='zh'?'待确认具体楼层':'Exact floor pending'}</div><div class="legend-row"><span class="legend-line" style="--legend-line:var(--pause)"></span>${lang==='zh'?'硬条件失败':'Hard-rule fail'}</div><div class="legend-separator"></div><div class="legend-row"><span class="legend-dash" style="--legend-line:#59667a"></span>${lang==='zh'?'站点硬步行半径':'Hard walking radius'}</div>`};
  document.getElementById('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';renderAll(false)};document.getElementById('overview').onclick=overview;document.getElementById('fullscreen').onclick=()=>document.getElementById('map-shell').requestFullscreen?.();document.addEventListener('fullscreenchange',()=>setTimeout(()=>map.invalidateSize(),150));init();
})();
</script>
</body>
